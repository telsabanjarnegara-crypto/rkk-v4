<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12304a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RKK V4.4.2 — Rencana & Keuangan Keluarga</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<style>
:root{--navy:#12304a;--blue:#1976d2;--green:#15803d;--red:#dc2626;--amber:#b45309;--bg:#eef3f7;--card:#fff;--line:#d9e2ea;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}
body{padding-bottom:env(safe-area-inset-bottom)}header{background:var(--navy);color:#fff;padding:16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:21px}header small{opacity:.85}
nav{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:71px;z-index:9;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav button{border:0;border-radius:12px;padding:11px 14px;background:#edf2f6;color:#334155;font-weight:800;white-space:nowrap}
nav button.active{background:var(--blue);color:#fff}main{max-width:1180px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid #e4eaf0;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #12304a0b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.kpi b{display:block;font-size:21px;margin-top:5px}
.row,.between{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
label{display:block;font-size:13px;font-weight:800;color:#475569;margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#e5ebf0;color:#172033}.danger{background:#fee2e2;color:#991b1b}
.success{color:var(--green)}.negative{color:var(--red)}.muted{color:var(--muted);font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb;font-size:13px}th{color:#475569}.tablewrap{overflow:auto}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#e2e8f0}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}
.summarybox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdff}.statusline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.bar{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bar.over i{background:var(--red)}.bar.warn i{background:var(--amber)}.bar.good i{background:var(--green)}
.metric{font-size:12px;color:var(--muted)}.overtext{color:var(--red);font-weight:800}.warntext{color:var(--amber);font-weight:800}.goodtext{color:var(--green);font-weight:800}
.modal{position:fixed;inset:0;background:#0f172a88;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}.modalbox{background:#fff;border-radius:18px;width:min(820px,100%);max-height:94vh;overflow:auto;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#e5ebf0;border-radius:50%;width:38px;height:38px;font-size:22px}
.notice{padding:12px;border-radius:12px;background:#eef6ff;border:1px solid #bfdbfe;margin:10px 0}.future{background:#eff6ff;color:#1d4ed8}.filterrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filterrow>div{min-width:180px;flex:1}
.evalgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.evalmini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.evalmini b{display:block;font-size:18px;margin-top:5px}
.install{position:fixed;right:14px;bottom:16px;z-index:30}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.evalgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header h1{font-size:18px}main{padding:10px}.grid{grid-template-columns:1fr 1fr}.kpi b{font-size:17px}th,td{font-size:12px;padding:7px}.evalgrid{grid-template-columns:1fr 1fr}}
@media(display-mode:standalone){header{padding-top:max(12px,env(safe-area-inset-top))}nav{top:65px}}
</style>
</head>
<body>
<header><h1>RKK V4.4.2</h1><small>Rencana → Antisipasi → Catat → Evaluasi • Tablet • Free • Offline</small></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="page"></section>
<section id="rencana" class="page"></section>
<section id="transaksi" class="page"></section>
<section id="evaluasi" class="page"></section>
<section id="laporan" class="page"></section>
<section id="pengaturan" class="page"></section>
</main>
<button id="installBtn" class="btn primary install" style="display:none" onclick="installApp()">📲 Pasang sebagai Aplikasi</button>
<script>
const KEY='RKK_V4_TABLET_FREE';
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const defaultAccounts=[
{id:'a1',group:'Biaya',category:'Biaya Rutin',name:'Gaji ART',type:'Rutin',status:'Aktif'},
{id:'a2',group:'Biaya',category:'Biaya Rutin',name:'Listrik & Air',type:'Rutin',status:'Aktif'},
{id:'a3',group:'Biaya',category:'Biaya Rutin',name:'Internet',type:'Rutin',status:'Aktif'},
{id:'a4',group:'Biaya',category:'Biaya Rutin',name:'Cicilan',type:'Rutin',status:'Aktif'},
{id:'a5',group:'Biaya',category:'Biaya Rumah Tangga',name:'Makanan',type:'Variabel',status:'Aktif'},
{id:'a6',group:'Biaya',category:'Biaya Rumah Tangga',name:'Keperluan Rumah',type:'Variabel',status:'Aktif'},
{id:'a7',group:'Biaya',category:'Biaya Pendidikan',name:'SPP',type:'Rutin',status:'Aktif'},
{id:'a8',group:'Biaya',category:'Biaya Pendidikan',name:'Buku & Perlengkapan',type:'Variabel',status:'Aktif'},
{id:'a9',group:'Pendapatan',category:'Gaji',name:'Gaji',type:'Rutin',status:'Aktif'},
{id:'a10',group:'Pendapatan',category:'Usaha',name:'Pendapatan Usaha',type:'Variabel',status:'Aktif'},
{id:'a11',group:'Pendapatan',category:'Pendapatan Lainnya',name:'Pendapatan Lainnya',type:'Tidak Rutin',status:'Aktif'},
{id:'a12',group:'Tabungan',category:'Dana Darurat',name:'Dana Darurat',type:'Target',status:'Aktif'},
{id:'a13',group:'Tabungan',category:'Pendidikan',name:'Tabungan Pendidikan',type:'Target',status:'Aktif'},
{id:'a14',group:'Investasi',category:'Investasi Bulanan',name:'Investasi Bulanan',type:'Rutin',status:'Aktif'},
{id:'a15',group:'Investasi',category:'Jangka Panjang',name:'Investasi Jangka Panjang',type:'Target',status:'Aktif'}];
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rp(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function num(n){return new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Number(n)||0)}
function currentYM(){const d=new Date();return {year:d.getFullYear(),month:d.getMonth()+1}}
function normalize(x){
 x=x&&typeof x==='object'?x:{};
 x.plans=Array.isArray(x.plans)?x.plans:[];x.tx=Array.isArray(x.tx)?x.tx:[];x.targets=Array.isArray(x.targets)?x.targets:[];
 x.accounts=Array.isArray(x.accounts)&&x.accounts.length?x.accounts:structuredClone(defaultAccounts);
 const now=currentYM();x.settings=x.settings&&typeof x.settings==='object'?x.settings:{year:now.year,month:now.month};
 x.settings.year=Number(x.settings.year)||now.year;x.settings.month=Number(x.settings.month)||now.month;
 x.plans.forEach(p=>{p.month=Number(p.month);p.year=Number(p.year);p.amount=Number(p.amount)||0});
 x.tx.forEach(t=>{t.amount=Number(t.amount)||0;t.date=String(t.date||'').slice(0,10)});
 x.plans.forEach(p=>{const a=x.accounts.find(a=>a.id===p.accountId);if(a)p.accountLabel=`${a.group} → ${a.category} → ${a.name}`});
 repairTransactionLinks(x);
 return x
}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''))}
function samePeriod(date,year,month){return validDate(date)&&Number(date.slice(0,4))===Number(year)&&Number(date.slice(5,7))===Number(month)}
function planMatchesTransaction(p,t){return !!p&&!!t&&p.type===t.type&&p.accountId===t.accountId&&samePeriod(t.date,p.year,p.month)}
function findMatchingPlanIn(data,type,accountId,date,exclude=''){if(!validDate(date))return null;const y=Number(date.slice(0,4)),m=Number(date.slice(5,7));const c=data.plans.filter(p=>p.id!==exclude&&p.year===y&&p.month===m&&p.type===type&&p.accountId===accountId);if(!c.length)return null;return c.sort((a,b)=>{const ar=data.tx.filter(t=>t.planId===a.id&&planMatchesTransaction(a,t)&&t.id!==exclude).reduce((s,t)=>s+Number(t.amount||0),0);const br=data.tx.filter(t=>t.planId===b.id&&planMatchesTransaction(b,t)&&t.id!==exclude).reduce((s,t)=>s+Number(t.amount||0),0);return ar/Math.max(a.amount,1)-br/Math.max(b.amount,1)})[0]}
function repairTransactionLinks(data){let relinked=0,cleared=0;data.tx.forEach(t=>{const a=data.accounts.find(a=>a.id===t.accountId);if(a)t.accountLabel=`${a.group} → ${a.category} → ${a.name}`;let p=data.plans.find(p=>p.id===t.planId);if(!a||!validDate(t.date)||!accountMatchesType(a,t.type)){if(t.planId||t.planLabel){t.planId='';t.planLabel='';cleared++}return}if(!planMatchesTransaction(p,t)){const m=findMatchingPlanIn(data,t.type,t.accountId,t.date,t.id);if(m){if(t.planId!==m.id)relinked++;t.planId=m.id;t.planLabel=`${m.accountLabel} • ${months[m.month-1]} ${m.year}`}else{if(t.planId||t.planLabel)cleared++;t.planId='';t.planLabel=''}}else{t.planLabel=`${p.accountLabel} • ${months[p.month-1]} ${p.year}`}});return {relinked,cleared}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return normalize(x)}catch(e){}return normalize({})}
let db=load(),deferredPrompt=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));render();return true}catch(e){alert('Data belum tersimpan. Penyimpanan perangkat penuh atau diblokir. Silakan lakukan Backup lalu coba lagi.');return false}}
function accountTypes(group){return group==='Pendapatan'?['Pendapatan']:group==='Biaya'?['Belanja']:group==='Tabungan'?['Tabungan']:group==='Investasi'?['Investasi']:[]}
function accountMatchesType(a,type){return !!a&&accountTypes(a.group).includes(type)}
function periodTx(y=db.settings.year,m=db.settings.month){const ym=`${y}-${String(m).padStart(2,'0')}`;return db.tx.filter(t=>String(t.date||'').startsWith(ym))}
function plansFor(y,m){return db.plans.filter(p=>p.year===Number(y)&&p.month===Number(m))}
function actualForPlan(pid,exclude=''){const p=db.plans.find(x=>x.id===pid);if(!p)return 0;return db.tx.filter(t=>t.planId===pid&&t.id!==exclude&&planMatchesTransaction(p,t)).reduce((s,t)=>s+Number(t.amount||0),0)}
function findMatchingPlan(type,accountId,date,exclude=''){return findMatchingPlanIn(db,type,accountId,date,exclude)}
function budgetState(type,plan,actual,periodFuture=false){
 if(periodFuture)return {cls:'info',badge:'Belum berjalan',text:'Periode belum berjalan'};
 if(plan<=0)return actual>0?{cls:type==='Pendapatan'?'warn':'bad',badge:type==='Pendapatan'?'Tanpa rencana':'Tidak direncanakan',text:`Aktual ${rp(actual)}`}:{cls:'good',badge:'Belum ada rencana',text:'Belum ada nilai rencana'};
 if(type==='Pendapatan'){if(actual>=plan)return {cls:'good',badge:'Tercapai',text:`Tercapai ${Math.round(actual/plan*100)}%`};if(actual>=plan*.8)return {cls:'warn',badge:'Perhatian',text:`${Math.round(actual/plan*100)}% tercapai`};return {cls:'bad',badge:'Belum tercapai',text:`${Math.round(actual/plan*100)}% tercapai`}}
 if(actual>plan)return {cls:'bad',badge:'OVER',text:`Over ${rp(actual-plan)} (${Math.round(actual/plan*100)}%)`};
 if(actual>=plan*.8)return {cls:'warn',badge:'Perhatian',text:`Terpakai ${Math.round(actual/plan*100)}%`};
 return {cls:'good',badge:'Aman',text:`Terpakai ${Math.round(actual/plan*100)}%`}
}
function periodIsFuture(y,m){const now=currentYM();return Number(y)>now.year||(Number(y)===now.year&&Number(m)>now.month)}
function summary(y=db.settings.year,m=db.settings.month){
 const tx=periodTx(y,m),ps=plansFor(y,m),inc=tx.filter(x=>x.type==='Pendapatan').reduce((s,x)=>s+x.amount,0),out=tx.filter(x=>x.type!=='Pendapatan').reduce((s,x)=>s+x.amount,0),pi=ps.filter(x=>x.type==='Pendapatan').reduce((s,x)=>s+x.amount,0),po=ps.filter(x=>x.type!=='Pendapatan').reduce((s,x)=>s+x.amount,0);
 return {tx,ps,inc,out,net:inc-out,pi,po}
}
const menus=[['dashboard','Dashboard'],['rencana','Rencana'],['transaksi','Transaksi'],['evaluasi','Evaluasi'],['laporan','Laporan'],['pengaturan','Pengaturan']];
nav.innerHTML=menus.map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));location.hash=p}
function render(){renderDashboard();renderRencana();renderTransaksi();renderEvaluasi();renderLaporan();renderPengaturan();let p=location.hash.slice(1)||'dashboard';if(!document.getElementById(p))p='dashboard';go(p)}
function renderDashboard(){
 const q=summary(),future=db.plans.filter(p=>periodIsFuture(p.year,p.month)).sort((a,b)=>a.year-b.year||a.month-b.month).slice(0,8);
 const incState=budgetState('Pendapatan',q.pi,q.inc,false),outState=budgetState('Belanja',q.po,q.out,false);
 const futureMap={};future.forEach(p=>{const k=`${p.year}-${p.month}`;futureMap[k]??={year:p.year,month:p.month,total:0,count:0};futureMap[k].total+=p.amount;futureMap[k].count++});
 dashboard.innerHTML=`<div class="between"><h2>Dashboard</h2><span class="badge ok">● Offline Ready</span></div>
 <div class="card"><div class="grid2"><div><label>Bulan Evaluasi</label><select onchange="db.settings.month=+this.value;save()">${months.map((m,i)=>`<option value="${i+1}" ${i+1===db.settings.month?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Tahun</label><input type="number" value="${db.settings.year}" onchange="db.settings.year=+this.value;save()"></div></div></div>
 <div class="grid"><div class="kpi">SALDO AKTUAL<b class="${q.net>=0?'success':'negative'}">${rp(q.net)}</b></div><div class="kpi">PENDAPATAN AKTUAL<b>${rp(q.inc)}</b></div><div class="kpi">PENGELUARAN AKTUAL<b>${rp(q.out)}</b></div><div class="kpi">TRANSAKSI<b>${q.tx.length}</b></div></div>
 <div class="grid2"><div class="card"><h3>Rencana vs Aktual</h3>
 <div class="summarybox"><div class="statusline"><b>Pendapatan</b><span class="badge ${incState.cls==='good'?'ok':incState.cls==='warn'?'warn':'bad'}">${incState.badge}</span></div><div class="between"><span>${rp(q.pi)} → ${rp(q.inc)}</span><span class="metric">${incState.text}</span></div><div class="bar ${incState.cls}"><i style="width:${q.pi?Math.min(100,q.inc/q.pi*100):0}%"></i></div></div>
 <div class="summarybox" style="margin-top:10px"><div class="statusline"><b>Belanja + Investasi</b><span class="badge ${outState.cls==='good'?'ok':outState.cls==='warn'?'warn':'bad'}">${outState.badge}</span></div><div class="between"><span>${rp(q.po)} → ${rp(q.out)}</span><span class="metric">${outState.text}</span></div><div class="bar ${outState.cls}"><i style="width:${q.po?Math.min(100,q.out/q.po*100):0}%"></i></div></div></div>
 <div class="card"><h3>Aksi Cepat</h3><div class="row"><button class="btn primary" onclick="openPlan()">＋ Rencana</button><button class="btn primary" onclick="openTx()">＋ Transaksi</button><button class="btn secondary" onclick="go('evaluasi')">Evaluasi</button></div><p class="muted">Rencana dapat dibuat untuk bulan berjalan maupun bulan mendatang.</p><hr><div class="muted">Periode evaluasi: <b>${months[db.settings.month-1]} ${db.settings.year}</b></div></div></div>
 <div class="card"><div class="between"><div><h3>Agenda Keuangan Mendatang</h3><div class="muted">Rencana yang sudah disiapkan untuk periode setelah bulan berjalan.</div></div><button class="btn secondary" onclick="go('rencana')">Lihat rencana</button></div>${Object.keys(futureMap).length?Object.values(futureMap).map(x=>`<div class="priorityitem" style="margin-top:8px"><div><strong>${months[x.month-1]} ${x.year}</strong><br><small>${x.count} rencana</small></div><b class="num">${rp(x.total)}</b></div>`).join(''):'<div class="empty">Belum ada rencana untuk bulan mendatang.</div>'}</div>`;
}
let planFilter='future';
function planTable(arr){
 if(!arr.length)return '<div class="empty">Belum ada rencana pada filter ini.</div>';
 return `<div class="tablewrap"><table><thead><tr><th>Periode</th><th>Jenis</th><th>Akun</th><th class="num">Rencana</th><th class="num">Aktual</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(p=>{
  const r=actualForPlan(p.id),future=periodIsFuture(p.year,p.month),st=budgetState(p.type,p.amount,r,future);
  return `<tr><td>${months[p.month-1]} ${p.year}</td><td>${p.type}</td><td>${esc(p.accountLabel)}</td><td class="num">${num(p.amount)}</td><td class="num">${num(r)}</td><td><span class="badge ${st.cls==='good'?'ok':st.cls==='warn'?'warn':st.cls==='bad'?'bad':'info'}">${st.badge}</span><br><small>${st.text}</small></td><td><button class="btn secondary" onclick="editPlan('${p.id}')">✏️</button> <button class="btn danger" onclick="deletePlan('${p.id}')">🗑️</button></td></tr>`}).join('')}</tbody></table></div>`
}
function renderRencana(){
 const now=currentYM();let arr=[...db.plans];
 if(planFilter==='current')arr=arr.filter(p=>p.year===db.settings.year&&p.month===db.settings.month);
 if(planFilter==='future')arr=arr.filter(p=>periodIsFuture(p.year,p.month));
 if(planFilter==='3m'){arr=arr.filter(p=>{const d=(p.year*12+p.month)-(now.year*12+now.month);return d>=0&&d<=2})}
 if(planFilter==='6m'){arr=arr.filter(p=>{const d=(p.year*12+p.month)-(now.year*12+now.month);return d>=0&&d<=5})}
 arr.sort((a,b)=>a.year-b.year||a.month-b.month||a.type.localeCompare(b.type));
 rencana.innerHTML=`<div class="between"><h2>Rencana</h2><button class="btn primary" onclick="openPlan()">＋ Tambah Rencana</button></div>
 <div class="card"><div class="filterrow"><div><label>Tampilan Rencana</label><select onchange="planFilter=this.value;renderRencana()"><option value="future" ${planFilter==='future'?'selected':''}>Bulan mendatang</option><option value="current" ${planFilter==='current'?'selected':''}>Bulan evaluasi</option><option value="3m" ${planFilter==='3m'?'selected':''}>3 bulan ke depan</option><option value="6m" ${planFilter==='6m'?'selected':''}>6 bulan ke depan</option><option value="all" ${planFilter==='all'?'selected':''}>Semua rencana</option></select></div></div>
 <div class="notice">💡 <b>Rencana adalah antisipasi.</b> Anda dapat membuat rencana untuk bulan apa pun di masa depan. Rencana masa depan berstatus <b>Belum berjalan</b> dan belum dinilai OVER.</div>
 ${planTable(arr)}</div>`;
}
function renderTransaksi(){
 const recent=[...db.tx].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 transaksi.innerHTML=`<div class="between"><h2>Transaksi</h2><button class="btn primary" onclick="openTx()">＋ Tambah Transaksi</button></div><div class="notice">Transaksi akan otomatis mencari rencana berdasarkan <b>jenis + akun + bulan + tahun</b>.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Akun</th><th>Rencana</th><th>Keterangan</th><th class="num">Nominal</th><th>Aksi</th></tr></thead><tbody>${recent.length?recent.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${esc(x.accountLabel||'-')}</td><td>${esc(x.planLabel||'-')}</td><td>${esc(x.note||'')}</td><td class="num">${num(x.amount)}</td><td><button class="btn secondary" onclick="editTx('${x.id}')">✏️</button> <button class="btn danger" onclick="deleteTx('${x.id}')">🗑️</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`
}
function accountEvaluation(){
 const q=summary();return db.accounts.filter(a=>a.status==='Aktif').map(a=>{
  const allowed=accountTypes(a.group),ps=q.ps.filter(p=>p.accountId===a.id&&allowed.includes(p.type)),plan=ps.reduce((s,p)=>s+p.amount,0),actual=q.tx.filter(t=>t.accountId===a.id&&allowed.includes(t.type)).reduce((s,t)=>s+t.amount,0),income=a.group==='Pendapatan';
  let state;if(plan<=0)state=actual>0?(income?{cls:'warn',badge:'Tanpa rencana'}:{cls:'bad',badge:'Tidak direncanakan'}):{cls:'neutral',badge:'Belum ada aktivitas'};else if(income)state=actual>=plan?{cls:'good',badge:'Tercapai'}:actual>=plan*.8?{cls:'warn',badge:'Perhatian'}:{cls:'bad',badge:'Belum tercapai'};else state=actual>plan?{cls:'bad',badge:'OVER'}:actual>=plan*.8?{cls:'warn',badge:'Perhatian'}:{cls:'good',badge:'Aman'};
  return {a,plan,actual,state}
 })
}
function evalBadge(cls){return cls==='good'?'ok':cls==='warn'?'warn':cls==='bad'?'bad':'info'}
function renderEvaluasi(){
 const ev=accountEvaluation();const counts={good:0,warn:0,bad:0,neutral:0};ev.forEach(x=>counts[x.state.cls]=(counts[x.state.cls]||0)+1);
 evaluasi.innerHTML=`<div class="between"><h2>Evaluasi</h2><button class="btn secondary" onclick="go('dashboard')">← Dashboard</button></div><div class="card"><p class="muted">Periode aktif: <b>${months[db.settings.month-1]} ${db.settings.year}</b>. Rencana bulan mendatang belum dievaluasi sebagai aktual.</p><div class="evalgrid"><div class="evalmini"><span class="muted">Aman / Tercapai</span><b class="success">${counts.good}</b></div><div class="evalmini"><span class="muted">Perhatian</span><b style="color:var(--amber)">${counts.warn}</b></div><div class="evalmini"><span class="muted">Over / Belum tercapai</span><b class="negative">${counts.bad}</b></div><div class="evalmini"><span class="muted">Belum ada aktivitas</span><b style="color:var(--muted)">${counts.neutral}</b></div></div></div><div class="card"><h3>Evaluasi per Akun</h3><div class="tablewrap"><table><thead><tr><th>Kelompok / Kategori / Akun</th><th class="num">Rencana</th><th class="num">Aktual</th><th class="num">Selisih</th><th>Status</th></tr></thead><tbody>${ev.map(x=>{const income=x.a.group==='Pendapatan',diff=income?x.actual-x.plan:x.plan-x.actual;return `<tr><td><b>${esc(x.a.group)}</b> → ${esc(x.a.category)} → <b>${esc(x.a.name)}</b></td><td class="num">${num(x.plan)}</td><td class="num">${num(x.actual)}</td><td class="num">${num(diff)}</td><td><span class="badge ${evalBadge(x.state.cls)}">${x.state.badge}</span></td></tr>`}).join('')}</tbody></table></div></div>`
}
function renderLaporan(){
 const q=summary();laporan.innerHTML=`<h2>Laporan</h2><div class="card"><b>Periode laporan</b><div class="muted">${months[db.settings.month-1]} ${db.settings.year}</div></div><div class="grid"><div class="kpi">Pendapatan<b>${rp(q.inc)}</b></div><div class="kpi">Pengeluaran<b>${rp(q.out)}</b></div><div class="kpi">Saldo<b class="${q.net>=0?'success':'negative'}">${rp(q.net)}</b></div><div class="kpi">Transaksi<b>${q.tx.length}</b></div></div><div class="card"><h3>Rencana Mendatang</h3><div class="tablewrap"><table><thead><tr><th>Periode</th><th>Akun</th><th class="num">Rencana</th><th>Status</th></tr></thead><tbody>${db.plans.filter(p=>periodIsFuture(p.year,p.month)).sort((a,b)=>a.year-b.year||a.month-b.month).map(p=>`<tr><td>${months[p.month-1]} ${p.year}</td><td>${esc(p.accountLabel)}</td><td class="num">${num(p.amount)}</td><td><span class="badge info">Belum berjalan</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada rencana mendatang.</td></tr>'}</tbody></table></div></div><div class="card"><button class="btn primary" onclick="exportCSV()">⬇️ Export CSV</button> <button class="btn secondary" onclick="window.print()">🖨️ Cetak / PDF</button></div>`
}
function renderPengaturan(){
 const groups=[...new Set(db.accounts.map(a=>a.group))];
 pengaturan.innerHTML=`<h2>Pengaturan</h2><div class="card"><div class="between"><div><h3>Akun Transaksi</h3><div class="muted">Kelompok → Kategori → Akun</div></div><button class="btn primary" onclick="openAccount()">＋ Tambah Akun</button></div>${groups.map(g=>`<div style="margin-top:14px"><b>${esc(g)}</b>${[...new Set(db.accounts.filter(a=>a.group===g).map(a=>a.category))].map(c=>`<div style="margin:7px 0 0 12px"><b>${esc(c)}</b><div class="tablewrap"><table><tbody>${db.accounts.filter(a=>a.group===g&&a.category===c).map(a=>`<tr><td>${esc(a.name)}</td><td>${a.type}</td><td>${a.status}</td><td><button class="btn secondary" onclick="editAccount('${a.id}')">✏️</button></td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>`).join('')}</div>
 <div class="card"><h3>Backup & Restore</h3><button class="btn primary" onclick="backup()">💾 Backup</button> <label class="btn secondary" style="display:inline-block">↩️ Restore<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label><button class="btn danger" onclick="resetAll()">Reset Data</button><p class="muted">Data disimpan lokal di tablet. Backup sebelum perubahan besar.</p></div>
 <div class="card"><h3>Diagnostic Database</h3><div class="grid"><div class="kpi">Rencana<b>${db.plans.length}</b></div><div class="kpi">Transaksi<b>${db.tx.length}</b></div><div class="kpi">Akun<b>${db.accounts.length}</b></div><div class="kpi">Target<b>${db.targets.length}</b></div></div><div class="row"><button class="btn secondary" onclick="repairData()">🔧 Periksa & Perbaiki Tautan</button></div><p class="muted">Pemeriksaan memastikan transaksi hanya terhubung ke rencana dengan <b>jenis + akun + bulan + tahun</b> yang sama. Database key: ${KEY}</p></div>`
}
function accountOptionsForType(type,selected=''){return db.accounts.filter(a=>a.status==='Aktif'&&accountMatchesType(a,type)).map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.group)} → ${esc(a.category)} → ${esc(a.name)}</option>`).join('')}
function openPlan(existing=null){
 const p=existing?db.plans.find(x=>x.id===existing):null,type=p?.type||'Belanja',d=modal(`<div class="modalhead"><h2>${p?'Edit':'Tambah'} Rencana</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div><div class="grid2"><div><label>Jenis</label><select id="pType" onchange="refreshPlanAccounts(this.closest('.modal'))"><option>Pendapatan</option><option>Belanja</option><option>Tabungan</option><option>Investasi</option></select></div><div><label>Akun Rencana</label><select id="pAccount">${accountOptionsForType(type,p?.accountId)}</select></div><div><label>Bulan Rencana</label><select id="pMonth">${months.map((m,i)=>`<option value="${i+1}" ${i+1===(p?.month||db.settings.month)?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Tahun Rencana</label><input id="pYear" type="number" value="${p?.year||db.settings.year}"></div><div><label>Nilai Rencana</label><input id="pAmount" type="number" min="1" step="1000" value="${p?.amount||''}"></div><div><label>Catatan</label><input id="pNote" value="${esc(p?.note||'')}" placeholder="Contoh: antisipasi SPP"></div></div><div class="notice">📌 Rencana dapat dibuat untuk <b>bulan mendatang</b>. Rencana masa depan akan otomatis berstatus <b>Belum berjalan</b>.</div><div class="row"><button class="btn primary" onclick="savePlan('${p?.id||''}',this)">Simpan</button><button class="btn secondary" onclick="this.closest('.modal').remove()">Batal</button></div>`);
 d.querySelector('#pType').value=type;refreshPlanAccounts(d)
}
function refreshPlanAccounts(d){const type=d.querySelector('#pType').value,sel=d.querySelector('#pAccount'),cur=sel.value;sel.innerHTML=accountOptionsForType(type,cur);if(!sel.value&&sel.options.length)sel.selectedIndex=0}
function savePlan(pid,btn){const d=btn.closest('.modal'),type=d.querySelector('#pType').value,aid=d.querySelector('#pAccount').value,a=db.accounts.find(x=>x.id===aid),amount=Number(d.querySelector('#pAmount').value),month=Number(d.querySelector('#pMonth').value),year=Number(d.querySelector('#pYear').value);if(!a||!amount||amount<0||!year||!accountMatchesType(a,type)){alert('Data rencana belum lengkap atau akun tidak sesuai.');return}const obj={id:pid||id(),type,accountId:aid,accountLabel:`${a.group} → ${a.category} → ${a.name}`,month,year,amount,note:d.querySelector('#pNote').value};if(pid)Object.assign(db.plans.find(x=>x.id===pid),obj);else db.plans.push(obj);repairTransactionLinks(db);if(save())d.remove()}
function editPlan(i){openPlan(i)}function deletePlan(i){if(confirm('Hapus rencana?')){db.plans=db.plans.filter(x=>x.id!==i);db.tx.forEach(t=>{if(t.planId===i){t.planId='';t.planLabel=''}});save()}}
function planOptions(type,accountId,date,selected=''){if(!date)return '<option value="">— Tanpa rencana —</option>';const y=Number(date.slice(0,4)),m=Number(date.slice(5,7));return '<option value="">— Tanpa rencana —</option>'+plansFor(y,m).filter(p=>(!type||p.type===type)&&(!accountId||p.accountId===accountId)).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.accountLabel)} • ${num(p.amount)}</option>`).join('')}
function openTx(existing=null){
 const x=existing?db.tx.find(t=>t.id===existing):null,type=x?.type||'Belanja',date=x?.date||new Date().toISOString().slice(0,10),d=modal(`<div class="modalhead"><h2>${x?'Edit':'Tambah'} Transaksi</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div><div class="grid2"><div><label>Tanggal</label><input id="tDate" type="date" value="${date}" onchange="syncTx(this.closest('.modal'))"></div><div><label>Jenis</label><select id="tType" onchange="syncTx(this.closest('.modal'))"><option>Pendapatan</option><option>Belanja</option><option>Tabungan</option><option>Investasi</option></select></div><div><label>Akun Transaksi</label><select id="tAccount" onchange="syncTx(this.closest('.modal'))"></select></div><div><label>Hubungkan ke Rencana</label><select id="tPlan"></select></div><div><label>Nominal</label><input id="tAmount" type="number" min="1" step="1000" value="${x?.amount||''}"></div><div><label>Keterangan</label><input id="tNote" value="${esc(x?.note||'')}"></div></div><div class="notice">Smart Matching: <b>Jenis + Akun + Bulan + Tahun</b>. Jika cocok, rencana dipilih otomatis.</div><div class="row"><button class="btn primary" onclick="saveTx('${x?.id||''}',this)">Simpan</button><button class="btn secondary" onclick="this.closest('.modal').remove()">Batal</button></div>`);
 d.dataset.txid=x?.id||'';d.querySelector('#tType').value=type;syncTx(d);if(x?.planId)d.querySelector('#tPlan').value=x.planId
}
function syncTx(d){const type=d.querySelector('#tType').value,acc=d.querySelector('#tAccount'),cur=acc.value;acc.innerHTML=accountOptionsForType(type,cur);if(!acc.value&&acc.options.length)acc.selectedIndex=0;const plan=d.querySelector('#tPlan'),curPlan=plan.value;plan.innerHTML=planOptions(type,acc.value,d.querySelector('#tDate').value,curPlan);if(!plan.value){const p=findMatchingPlan(type,acc.value,d.querySelector('#tDate').value,d.dataset.txid||'');if(p)plan.value=p.id}}
function saveTx(tid,btn){const d=btn.closest('.modal'),type=d.querySelector('#tType').value,aid=d.querySelector('#tAccount').value,a=db.accounts.find(x=>x.id===aid),date=d.querySelector('#tDate').value,amount=Number(d.querySelector('#tAmount').value),selected=d.querySelector('#tPlan').value,p=db.plans.find(x=>x.id===selected);if(!a||!validDate(date)||!amount||amount<=0||!accountMatchesType(a,type)){alert('Tanggal, nominal, atau akun transaksi belum valid.');return}let matched=planMatchesTransaction(p,{type,accountId:aid,date})?p:null;if(!matched)matched=findMatchingPlan(type,aid,date,tid||'');const obj={id:tid||id(),date,type,accountId:aid,accountLabel:`${a.group} → ${a.category} → ${a.name}`,planId:matched?.id||'',planLabel:matched?`${matched.accountLabel} • ${months[matched.month-1]} ${matched.year}`:'',amount,note:d.querySelector('#tNote').value};if(tid)Object.assign(db.tx.find(x=>x.id===tid),obj);else db.tx.unshift(obj);repairTransactionLinks(db);if(save())d.remove()}
function editTx(i){openTx(i)}function deleteTx(i){if(confirm('Hapus transaksi?')){db.tx=db.tx.filter(x=>x.id!==i);save()}}
function openAccount(existing=null){const a=existing?db.accounts.find(x=>x.id===existing):null,d=modal(`<div class="modalhead"><h2>${a?'Edit':'Tambah'} Akun</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div><div class="grid2"><div><label>Kelompok</label><select id="aGroup"><option>Biaya</option><option>Pendapatan</option><option>Tabungan</option><option>Investasi</option></select></div><div><label>Kategori</label><input id="aCat" value="${esc(a?.category||'')}" placeholder="Contoh: Biaya Rutin"></div><div><label>Akun</label><input id="aName" value="${esc(a?.name||'')}" placeholder="Contoh: Gaji ART"></div><div><label>Sifat</label><select id="aType"><option>Rutin</option><option>Tidak Rutin</option><option>Variabel</option><option>Target</option></select></div><div><label>Status</label><select id="aStatus"><option>Aktif</option><option>Nonaktif</option></select></div></div><button class="btn primary" onclick="saveAccount('${a?.id||''}',this)">Simpan</button>`);if(a){d.querySelector('#aGroup').value=a.group;d.querySelector('#aType').value=a.type;d.querySelector('#aStatus').value=a.status}}
function editAccount(i){openAccount(i)}
function saveAccount(i,b){const d=b.closest('.modal'),group=d.querySelector('#aGroup').value,category=d.querySelector('#aCat').value.trim(),name=d.querySelector('#aName').value.trim();if(!category||!name){alert('Kategori dan akun wajib diisi.');return}const obj={id:i||id(),group,category,name,type:d.querySelector('#aType').value,status:d.querySelector('#aStatus').value};if(i)Object.assign(db.accounts.find(x=>x.id===i),obj);else db.accounts.push(obj);repairTransactionLinks(db);if(save())d.remove()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='RKK_V4_4_2_Backup.json';a.click()}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=normalize(JSON.parse(r.result));if(confirm('Restore mengganti data saat ini. Lanjutkan?')){db=x;if(save())alert('Restore berhasil dan tautan transaksi diperiksa ulang.')}}catch(_){alert('Backup tidak valid.')}};r.readAsText(f);e.target.value=''}
function repairData(){const result=repairTransactionLinks(db);if(save())alert(`Pemeriksaan selesai. Tautan diperbaiki: ${result.relinked}. Tautan dilepas karena tidak valid: ${result.cleared}. Data lainnya tetap dipertahankan.`)}
function resetAll(){if(confirm('Hapus seluruh data RKK? Backup terlebih dahulu.')){localStorage.removeItem(KEY);db=load();render()}}
function exportCSV(){const rows=[['Tanggal','Jenis','Kelompok','Kategori','Akun','Bulan Rencana','Tahun Rencana','Nominal','Keterangan']];db.tx.forEach(t=>{const a=db.accounts.find(a=>a.id===t.accountId),p=db.plans.find(p=>p.id===t.planId);rows.push([t.date,t.type,a?.group||'',a?.category||'',a?.name||'',p?months[p.month-1]:'',p?.year||'',t.amount,t.note||''])});const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='RKK_V4_4_2_Transaksi.csv';a.click()}
function modal(inner){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalbox">${inner}</div>`;document.body.appendChild(d);return d}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
</html>
