<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12304a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RKK V4.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<title>RKK V4.0 — Rencana & Keuangan Keluarga</title>
<style>
:root{--navy:#12304a;--blue:#1976d2;--green:#15803d;--red:#dc2626;--amber:#b45309;--bg:#eef3f7;--card:#fff;--line:#d9e2ea;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}
body{padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:21px}header small{opacity:.82}
nav{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:71px;z-index:9;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav button{border:0;border-radius:12px;padding:11px 14px;background:#edf2f6;color:#334155;font-weight:800;white-space:nowrap}
nav button.active{background:var(--blue);color:#fff}
main{max-width:1180px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid #e4eaf0;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #12304a0b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.kpi b{display:block;font-size:21px;margin-top:5px}
.row,.between{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
label{display:block;font-size:13px;font-weight:800;color:#475569;margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#e5ebf0;color:#172033}.danger{background:#fee2e2;color:#991b1b}.success{color:var(--green)}.negative{color:var(--red)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb;font-size:13px}th{color:#475569}.tablewrap{overflow:auto}
.bar{height:11px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#e2e8f0}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.muted{color:var(--muted);font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0f172a88;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}.modalbox{background:#fff;border-radius:18px;width:min(820px,100%);max-height:94vh;overflow:auto;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{border:0;background:#e5ebf0;border-radius:50%;width:38px;height:38px;font-size:22px}
.install{position:fixed;right:14px;bottom:16px;z-index:30;box-shadow:0 4px 18px #0003}
.notice{padding:12px;border-radius:12px;background:#eef6ff;border:1px solid #bfdbfe;margin:10px 0}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){header h1{font-size:18px}main{padding:10px}.grid{grid-template-columns:1fr 1fr}.kpi b{font-size:17px}th,td{font-size:12px;padding:7px}}
@media(display-mode:standalone){header{padding-top:max(12px,env(safe-area-inset-top))}nav{top:65px}}
</style>
</head>
<body>
<header>
  <h1>RKK V4.0</h1>
  <small>Rencana → Laksanakan → Catat → Evaluasi • Tablet • Free • Offline</small>
</header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="page"></section>
<section id="rencana" class="page"></section>
<section id="transaksi" class="page"></section>
<section id="evaluasi" class="page"></section>
<section id="laporan" class="page"></section>
<section id="pengaturan" class="page"></section>
</main>
<button id="installBtn" class="btn primary install" style="display:none" onclick="installApp()">📲 Pasang sebagai Aplikasi</button>

<script>
const KEY='RKK_V4_TABLET_FREE';
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const defaultAccounts=[
 {id:'a1',group:'Biaya',category:'Biaya Rutin',name:'Gaji ART',type:'Rutin',status:'Aktif'},
 {id:'a2',group:'Biaya',category:'Biaya Rutin',name:'Listrik & Air',type:'Rutin',status:'Aktif'},
 {id:'a3',group:'Biaya',category:'Biaya Rutin',name:'Internet',type:'Rutin',status:'Aktif'},
 {id:'a4',group:'Biaya',category:'Biaya Rutin',name:'Cicilan',type:'Rutin',status:'Aktif'},
 {id:'a5',group:'Biaya',category:'Biaya Rumah Tangga',name:'Makanan',type:'Variabel',status:'Aktif'},
 {id:'a6',group:'Biaya',category:'Biaya Rumah Tangga',name:'Keperluan Rumah',type:'Variabel',status:'Aktif'},
 {id:'a7',group:'Biaya',category:'Biaya Pendidikan',name:'SPP',type:'Rutin',status:'Aktif'},
 {id:'a8',group:'Biaya',category:'Biaya Pendidikan',name:'Buku & Perlengkapan',type:'Variabel',status:'Aktif'},
 {id:'a9',group:'Pendapatan',category:'Gaji',name:'Gaji',type:'Rutin',status:'Aktif'},
 {id:'a10',group:'Pendapatan',category:'Usaha',name:'Pendapatan Usaha',type:'Variabel',status:'Aktif'},
 {id:'a11',group:'Pendapatan',category:'Pendapatan Lainnya',name:'Pendapatan Lainnya',type:'Tidak Rutin',status:'Aktif'},
 {id:'a12',group:'Tabungan',category:'Dana Darurat',name:'Dana Darurat',type:'Target',status:'Aktif'},
 {id:'a13',group:'Tabungan',category:'Pendidikan',name:'Tabungan Pendidikan',type:'Target',status:'Aktif'},
 {id:'a14',group:'Investasi',category:'Investasi Bulanan',name:'Investasi Bulanan',type:'Rutin',status:'Aktif'},
 {id:'a15',group:'Investasi',category:'Jangka Panjang',name:'Investasi Jangka Panjang',type:'Target',status:'Aktif'}
];
let db=load(), deferredPrompt=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return normalize(x)}catch(e){}return {plans:[],tx:[],accounts:structuredClone(defaultAccounts),targets:[],settings:{year:new Date().getFullYear(),month:new Date().getMonth()+1}}}
function normalize(x){x.plans??=[];x.tx??=[];x.accounts=(x.accounts&&x.accounts.length)?x.accounts:structuredClone(defaultAccounts);x.targets??=[];x.settings??={year:new Date().getFullYear(),month:new Date().getMonth()+1};return x}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function rp(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function totalTx(){let inc=db.tx.filter(x=>x.type==='Pendapatan').reduce((s,x)=>s+x.amount,0),out=db.tx.filter(x=>x.type==='Belanja'||x.type==='Investasi').reduce((s,x)=>s+x.amount,0);return {inc,out,net:inc-out}}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));location.hash=p}
const menus=[['dashboard','Dashboard'],['rencana','Rencana'],['transaksi','Transaksi'],['evaluasi','Evaluasi'],['laporan','Laporan'],['pengaturan','Pengaturan']];
nav.innerHTML=menus.map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
function render(){renderDashboard();renderRencana();renderTransaksi();renderEvaluasi();renderLaporan();renderPengaturan();let p=location.hash.slice(1)||'dashboard';if(!document.getElementById(p))p='dashboard';go(p)}
function scope(){return db.plans.filter(x=>x.year===db.settings.year&&x.month===db.settings.month)}
function planTable(arr){if(!arr.length)return '<div class="empty">Belum ada rencana pada periode ini.</div>';return `<div class="tablewrap"><table><thead><tr><th>Jenis</th><th>Akun</th><th>Rencana</th><th>Realisasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(p=>{let r=db.tx.filter(t=>t.planId===p.id).reduce((s,t)=>s+t.amount,0),pct=p.amount?r/p.amount*100:0;let cls=p.type==='Pendapatan'?(r>=p.amount?'ok':'warn'):(r>p.amount?'bad':r>=p.amount*.8?'warn':'ok');return `<tr><td>${p.type}</td><td>${esc(p.accountLabel)}</td><td>${rp(p.amount)}</td><td>${rp(r)}</td><td><span class="badge ${cls}">${p.type==='Pendapatan'?(r>=p.amount?'Tercapai':'Berjalan'):(r>p.amount?'Melebihi':pct>=80?'Perhatian':'Aman')}</span></td><td><button class="btn secondary" onclick="editPlan('${p.id}')">✏️</button> <button class="btn danger" onclick="deletePlan('${p.id}')">🗑️</button></td></tr>`}).join('')}</tbody></table></div>`}
function renderDashboard(){const t=totalTx(),s=scope(),planInc=s.filter(x=>x.type==='Pendapatan').reduce((a,b)=>a+b.amount,0),planOut=s.filter(x=>x.type!=='Pendapatan').reduce((a,b)=>a+b.amount,0),actualInc=db.tx.filter(x=>x.type==='Pendapatan'&&x.date.startsWith(`${db.settings.year}-${String(db.settings.month).padStart(2,'0')}`)).reduce((a,b)=>a+b.amount,0),actualOut=db.tx.filter(x=>x.type!=='Pendapatan'&&x.date.startsWith(`${db.settings.year}-${String(db.settings.month).padStart(2,'0')}`)).reduce((a,b)=>a+b.amount,0);dashboard.innerHTML=`<div class="between"><h2>Dashboard</h2><span class="badge ok">● Offline Ready</span></div><div class="card"><div class="grid2"><div><label>Bulan Evaluasi</label><select onchange="db.settings.month=+this.value;save()">${months.map((m,i)=>`<option value="${i+1}" ${i+1===db.settings.month?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Tahun</label><input type="number" value="${db.settings.year}" onchange="db.settings.year=+this.value;save()"></div></div></div><div class="grid"><div class="kpi">SALDO AKTUAL<b class="${t.net>=0?'success':'negative'}">${rp(t.net)}</b></div><div class="kpi">PENDAPATAN AKTUAL<b>${rp(t.inc)}</b></div><div class="kpi">PENGELUARAN AKTUAL<b>${rp(t.out)}</b></div><div class="kpi">TRANSAKSI<b>${db.tx.length}</b></div></div><div class="grid2"><div class="card"><h3>Rencana vs Aktual</h3><div class="between"><span>Pendapatan</span><b>${rp(planInc)} → ${rp(actualInc)}</b></div><div class="bar"><i style="width:${planInc?Math.min(100,actualInc/planInc*100):0}%"></i></div><div class="between"><span>Belanja + Investasi</span><b>${rp(planOut)} → ${rp(actualOut)}</b></div><div class="bar"><i style="width:${planOut?Math.min(100,actualOut/planOut*100):0}%"></i></div></div><div class="card"><h3>Aksi Cepat</h3><div class="row"><button class="btn primary" onclick="openPlan()">＋ Rencana</button><button class="btn primary" onclick="openTx()">＋ Transaksi</button><button class="btn secondary" onclick="go('evaluasi')">Evaluasi</button></div><p class="muted">Setiap transaksi dapat langsung dihubungkan ke rencana agar evaluasi otomatis.</p></div></div>`}
function renderRencana(){const s=scope();rencana.innerHTML=`<div class="between"><h2>Rencana</h2><button class="btn primary" onclick="openPlan()">＋ Tambah Rencana</button></div><div class="card"><b>${months[db.settings.month-1]} ${db.settings.year}</b><p class="muted">Rencana pendapatan, biaya, tabungan dan investasi berada dalam satu alur.</p>${planTable(s)}</div>`}
function renderTransaksi(){const recent=[...db.tx].sort((a,b)=>b.date.localeCompare(a.date));transaksi.innerHTML=`<div class="between"><h2>Transaksi</h2><button class="btn primary" onclick="openTx()">＋ Tambah Transaksi</button></div><div class="notice">Pilih <b>akun transaksi</b> dan, bila ada, hubungkan dengan <b>rencana</b>. Realisasi akan masuk otomatis ke Evaluasi.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Akun</th><th>Rencana</th><th>Keterangan</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${recent.length?recent.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${esc(x.accountLabel||'-')}</td><td>${esc(x.planLabel||'-')}</td><td>${esc(x.note||'')}</td><td>${rp(x.amount)}</td><td><button class="btn secondary" onclick="editTx('${x.id}')">✏️</button> <button class="btn danger" onclick="deleteTx('${x.id}')">🗑️</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`}
function renderEvaluasi(){const s=scope();let rows=s.map(p=>{let r=db.tx.filter(t=>t.planId===p.id).reduce((a,b)=>a+b.amount,0);let diff=p.type==='Pendapatan'?r-p.amount:p.amount-r;let status=p.type==='Pendapatan'?(r>=p.amount?'Tercapai':'Belum tercapai'):(r>p.amount?'Over budget':r>=p.amount*.8?'Perhatian':'Aman');return {p,r,diff,status}});evaluasi.innerHTML=`<h2>Evaluasi</h2><div class="card"><p class="muted">Evaluasi membandingkan rencana dengan transaksi aktual pada bulan yang dipilih.</p>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Akun / Rencana</th><th>Rencana</th><th>Aktual</th><th>Selisih</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.p.accountLabel)}<br><small>${esc(x.p.note||'')}</small></td><td>${rp(x.p.amount)}</td><td>${rp(x.r)}</td><td>${rp(Math.abs(x.diff))}</td><td><span class="badge ${x.status==='Aman'||x.status==='Tercapai'?'ok':x.status==='Perhatian'||x.status==='Belum tercapai'?'warn':'bad'}">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada rencana. Buat rencana terlebih dahulu.</div>'}</div>`}
function renderLaporan(){const t=totalTx();laporan.innerHTML=`<h2>Laporan</h2><div class="grid"><div class="kpi">Pendapatan<b>${rp(t.inc)}</b></div><div class="kpi">Pengeluaran<b>${rp(t.out)}</b></div><div class="kpi">Saldo<b>${rp(t.net)}</b></div><div class="kpi">Jumlah Transaksi<b>${db.tx.length}</b></div></div><div class="card"><h3>Output</h3><div class="row"><button class="btn primary" onclick="exportCSV()">⬇️ Export CSV</button><button class="btn secondary" onclick="window.print()">🖨️ Cetak / PDF</button></div></div>`}
function renderPengaturan(){const groups=[...new Set(db.accounts.map(a=>a.group))];pengaturan.innerHTML=`<h2>Pengaturan</h2><div class="card"><div class="between"><div><h3>Akun Transaksi</h3><div class="muted">Struktur: Kelompok → Kategori → Jenis akun</div></div><button class="btn primary" onclick="openAccount()">＋ Tambah Akun</button></div>${groups.map(g=>`<div style="margin-top:14px"><b>${esc(g)}</b>${[...new Set(db.accounts.filter(a=>a.group===g).map(a=>a.category))].map(c=>`<div style="margin:7px 0 0 12px"><b>${esc(c)}</b><div class="tablewrap"><table><tbody>${db.accounts.filter(a=>a.group===g&&a.category===c).map(a=>`<tr><td>${esc(a.name)}</td><td>${a.type}</td><td>${a.status}</td><td><button class="btn secondary" onclick="editAccount('${a.id}')">✏️</button> <button class="btn danger" onclick="deleteAccount('${a.id}')">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>`).join('')}</div><div class="card"><h3>Backup & Restore</h3><div class="row"><button class="btn primary" onclick="backup()">💾 Backup</button><label class="btn secondary" style="display:inline-block">↩️ Restore<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label><button class="btn danger" onclick="resetAll()">Reset Data</button></div><p class="muted">Data disimpan lokal di tablet. Backup disarankan secara berkala.</p></div>`}
function accountOptions(selected=''){return db.accounts.filter(a=>a.status==='Aktif').map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.group)} → ${esc(a.category)} → ${esc(a.name)}</option>`).join('')}
function planOptions(selected=''){return `<option value="">— Tanpa rencana —</option>`+db.plans.filter(p=>p.year===db.settings.year&&p.month===db.settings.month).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.type)} • ${esc(p.accountLabel)} • ${rp(p.amount)}</option>`).join('')}
function modal(inner){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalbox">${inner}</div>`;document.body.appendChild(d);return d}
function openPlan(existing=null){const p=existing?db.plans.find(x=>x.id===existing):null;const d=modal(`<div class="modalhead"><h2>${p?'Edit':'Tambah'} Rencana</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div><div class="grid2"><div><label>Jenis</label><select id="pType"><option>Pendapatan</option><option>Belanja</option><option>Investasi</option></select></div><div><label>Akun Rencana</label><select id="pAccount">${accountOptions(p?.accountId)}</select></div><div><label>Bulan</label><select id="pMonth">${months.map((m,i)=>`<option value="${i+1}" ${i+1===(p?.month||db.settings.month)?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Tahun</label><input id="pYear" type="number" value="${p?.year||db.settings.year}"></div><div><label>Nilai Rencana</label><input id="pAmount" type="number" min="0" step="1000" value="${p?.amount||''}"></div><div><label>Catatan</label><input id="pNote" value="${esc(p?.note||'')}"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="savePlan('${p?.id||''}',this)">Simpan</button><button class="btn secondary" onclick="this.closest('.modal').remove()">Batal</button></div>`);d.querySelector('#pType').value=p?.type||'Belanja'}
function savePlan(pid,btn){const d=btn.closest('.modal'),aid=d.querySelector('#pAccount').value,a=db.accounts.find(x=>x.id===aid),amount=Number(d.querySelector('#pAmount').value);if(!aid||!amount||amount<0){alert('Jenis, akun dan nilai rencana wajib diisi.');return}const obj={id:pid||id(),type:d.querySelector('#pType').value,accountId:aid,accountLabel:`${a.group} → ${a.category} → ${a.name}`,month:+d.querySelector('#pMonth').value,year:+d.querySelector('#pYear').value,amount,note:d.querySelector('#pNote').value};if(pid)Object.assign(db.plans.find(x=>x.id===pid),obj);else db.plans.push(obj);save();d.remove()}
function editPlan(id){openPlan(id)} function deletePlan(id){if(confirm('Hapus rencana?')){db.plans=db.plans.filter(x=>x.id!==id);db.tx.forEach(t=>{if(t.planId===id){t.planId='';t.planLabel=''}});save()}}
function openTx(existing=null){const x=existing?db.tx.find(t=>t.id===existing):null;const d=modal(`<div class="modalhead"><h2>${x?'Edit':'Tambah'} Transaksi</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div><div class="grid2"><div><label>Tanggal</label><input id="tDate" type="date" value="${x?.date||new Date().toISOString().slice(0,10)}"></div><div><label>Jenis</label><select id="tType"><option>Pendapatan</option><option>Belanja</option><option>Investasi</option></select></div><div><label>Akun Transaksi</label><select id="tAccount">${accountOptions(x?.accountId)}</select></div><div><label>Hubungkan ke Rencana</label><select id="tPlan">${planOptions(x?.planId)}</select></div><div><label>Nominal</label><input id="tAmount" type="number" min="0" step="1000" value="${x?.amount||''}"></div><div><label>Keterangan</label><input id="tNote" value="${esc(x?.note||'')}"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveTx('${x?.id||''}',this)">Simpan</button><button class="btn secondary" onclick="this.closest('.modal').remove()">Batal</button></div>`);d.querySelector('#tType').value=x?.type||'Belanja'}
function saveTx(tid,btn){const d=btn.closest('.modal'),aid=d.querySelector('#tAccount').value,a=db.accounts.find(x=>x.id===aid),pid=d.querySelector('#tPlan').value,p=db.plans.find(x=>x.id===pid),amount=Number(d.querySelector('#tAmount').value);if(!aid||!amount||amount<0){alert('Akun dan nominal wajib diisi.');return}const obj={id:tid||id(),date:d.querySelector('#tDate').value,type:d.querySelector('#tType').value,accountId:aid,accountLabel:`${a.group} → ${a.category} → ${a.name}`,planId:pid,planLabel:p?`${p.accountLabel} • ${months[p.month-1]} ${p.year}`:'',amount,note:d.querySelector('#tNote').value};if(tid)Object.assign(db.tx.find(x=>x.id===tid),obj);else db.tx.unshift(obj);save();d.remove()}
function editTx(id){openTx(id)} function deleteTx(id){if(confirm('Hapus transaksi?')){db.tx=db.tx.filter(x=>x.id!==id);save()}}
function openAccount(existing=null){const a=existing?db.accounts.find(x=>x.id===existing):null;const d=modal(`<div class="modalhead"><h2>${a?'Edit':'Tambah'} Akun</h2><button class="close" onclick="this.closest('.modal').remove()">×</button></div><div class="grid2"><div><label>Kelompok Utama</label><select id="aGroup"><option>Biaya</option><option>Pendapatan</option><option>Tabungan</option><option>Investasi</option></select></div><div><label>Kategori</label><input id="aCat" value="${esc(a?.category||'')} " placeholder="Contoh: Biaya Rutin"></div><div><label>Jenis Akun</label><input id="aName" value="${esc(a?.name||'')} " placeholder="Contoh: Gaji ART"></div><div><label>Sifat</label><select id="aType"><option>Rutin</option><option>Tidak Rutin</option><option>Variabel</option><option>Target</option></select></div><div><label>Status</label><select id="aStatus"><option>Aktif</option><option>Nonaktif</option></select></div></div><p class="muted">Contoh struktur: <b>Biaya → Biaya Rutin → Gaji ART</b>.</p><button class="btn primary" onclick="saveAccount('${a?.id||''}',this)">Simpan</button>`);if(a){d.querySelector('#aGroup').value=a.group;d.querySelector('#aType').value=a.type;d.querySelector('#aStatus').value=a.status}}
function saveAccount(aid,btn){const d=btn.closest('.modal'),group=d.querySelector('#aGroup').value,category=d.querySelector('#aCat').value.trim(),name=d.querySelector('#aName').value.trim();if(!category||!name){alert('Kategori dan jenis akun wajib diisi.');return}const obj={id:aid||id(),group,category,name,type:d.querySelector('#aType').value,status:d.querySelector('#aStatus').value};if(aid)Object.assign(db.accounts.find(x=>x.id===aid),obj);else db.accounts.push(obj);save();d.remove()}
function editAccount(id){openAccount(id)} function deleteAccount(id){if(db.tx.some(x=>x.accountId===id)||db.plans.some(x=>x.accountId===id)){alert('Akun masih dipakai dalam rencana/transaksi. Nonaktifkan akun, jangan dihapus.');return}if(confirm('Hapus akun?')){db.accounts=db.accounts.filter(x=>x.id!==id);save()}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='RKK_V4_Backup.json';a.click()}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=normalize(JSON.parse(r.result));if(confirm('Restore akan mengganti data saat ini. Lanjutkan?')){db=x;save();alert('Restore berhasil.')}}catch(_){alert('Backup tidak valid.')}};r.readAsText(f)}
function resetAll(){if(confirm('Hapus seluruh data RKK V4.0 di tablet? Backup terlebih dahulu jika diperlukan.')){localStorage.removeItem(KEY);db=load();render()}}
function exportCSV(){const rows=[['Tanggal','Jenis','Kelompok Akun','Kategori','Akun','Rencana','Nominal','Keterangan'],...db.tx.map(x=>{const a=db.accounts.find(a=>a.id===x.accountId);return [x.date,x.type,a?.group||'',a?.category||'',a?.name||'',x.planLabel||'',x.amount,x.note||'']})];const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='RKK_V4_Transaksi.csv';a.click()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
async function installApp(){if(!deferredPrompt){alert('Jika tombol instal belum muncul, gunakan menu browser: Tambahkan ke layar utama / Install app.');return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}
window.addEventListener('appinstalled',()=>installBtn.style.display='none');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
